<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Ali — Data Science & ML Engineer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0a0e14',
          panel: '#10151f',
          panel2: '#141a26',
          slate: {
            accent: '#5b6ee8'
          },
          cyan: {
            accent: '#3ee6d8'
          },
          hair: '#1f2836'
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['"Inter"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace']
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  html { scroll-behavior: smooth; }
  body {
    background-color: #0a0e14;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(91,110,232,0.10), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(62,230,216,0.07), transparent 35%);
  }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  .font-body { font-family: 'Inter', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .grad-text {
    background: linear-gradient(100deg, #8b9bff 0%, #3ee6d8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .badge {
    border: 1px solid #263047;
    background: rgba(20,26,38,0.6);
  }

  .card {
    background: linear-gradient(180deg, #141a26 0%, #10151f 100%);
    border: 1px solid #1f2836;
    transition: transform .25s ease, border-color .25s ease;
  }
  .card:hover {
    border-color: #3ee6d8;
    transform: translateY(-4px);
  }

  .timeline-dot {
    box-shadow: 0 0 0 4px rgba(91,110,232,0.15);
  }

  .nav-link {
    position: relative;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    left: 0; bottom: -4px;
    width: 0%;
    height: 1px;
    background: #3ee6d8;
    transition: width .2s ease;
  }
  .nav-link:hover::after { width: 100%; }

  .cta-primary {
    background: linear-gradient(100deg, #5b6ee8, #3ee6d8);
  }

  ::selection { background: #3ee6d8; color: #0a0e14; }

  #mobile-menu { transition: max-height .3s ease, opacity .3s ease; }

  .skill-pill {
    border: 1px solid #263047;
    background: #10151f;
  }
  .skill-pill:hover { border-color: #5b6ee8; }

  .profile-ring {
    background: conic-gradient(from 180deg, #5b6ee8, #3ee6d8, #5b6ee8);
    box-shadow: 0 0 24px 2px rgba(62,230,216,0.25), 0 0 60px 10px rgba(91,110,232,0.12);
  }

  a:focus-visible, button:focus-visible {
    outline: 2px solid #3ee6d8;
    outline-offset: 2px;
  }
</style>
</head>
<body class="font-body text-slate-200 antialiased">
